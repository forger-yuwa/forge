    note: "手保守のエントリの MW・区間 (CEA に同名の気相がある種) と生成ブロックはこのファイルから生成 (tools/cea_thermo_to_forge_species.py --write; AIR は forge 擬似種)。ローカル版 (.venv-cea/nasa_cea/thermo.inp) の SHA-256。"
