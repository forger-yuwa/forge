# =============================================================================
# forge 共通 species データ (熱物性の正本) — C++ (ソルバ・変換器) と Python (設計・後処理) が同じこのファイルを読む。
#   plans/active/thermophysics-solver-owned-species-db.md §4.1 / §5.1 #4、仕様 methods/thermophysics.md §1b.1。
#
# 読み手:
#   - C++: ビルド時にバイナリへ埋め込む (cmake/embed_species_data.cmake → forge_species_data.hpp)。
#          input/speciesDB.cpp の speciesDB_builtin() が起動時に yaml-cpp でパースする。実行時にこのファイルは読まない。
#   - Python: design/forge_design/gas/species_data.py がこのファイルを直接読み、
#          semiperfect.SPECIES_NASA9 / LJ_PARAMS、composition.BUILTIN_ATOMS を作る (名前は従来の大文字キー)。
#
# 第一段 (#4) の約束は「値は移行前の内蔵値そのまま」だった。段 3 (#13-3, 2026-10-01) で CEA thermo.inp に同名の気相がある
#   手保守の種 (N2/O2/CO2/H2O/Ar/He/CO/H2/OH/H/NO/O) は thermo.inp そのもの (区間数・区切り・係数・MW) に揃え、互換性ハッシュが
#   一斉に変わった (旧値: H2O/He の MW の丸め、Ar 高温区間は単原子理想、6000–20000 K 区間なし)。MW・intervals は
#   tools/cea_thermo_to_forge_species.py --write が同期し、手保守の欄 (aliases・LJ・legacy_builtin・source・deviations・pair_of・
#   extension) は手で保守する。H2O(L) は係数そのまま・MW だけ気相 H2O に合わせる。AIR (擬似種) は CEA 由来でなくそのまま。
#   値の前後比較は tests/unit/test_species_data_bitexact.py (基準 tests/unit/data/species_builtin_baseline_v1.json; v0 は段 3 前)。
#
# スキーマ (forge_species_data_v1):
#   id          canonical ID (文字列として引用する: YAML 1.1 では NO が真偽値に化ける)。 (大小文字を区別。CEA の表記。forge 擬似種は AIR)
#   aliases     互換の別名 (完全一致で id に解決する。大小文字の同一視はしない)
#   phase       gas | condensed
#   legacy_builtin  移行前にどの内蔵表にあった種か (solver = C++ speciesDB_builtin, design = Python SPECIES_NASA9)。履歴の欄。
#               C++ (ソルバ) は #13-2 (2026-10-01) からこの欄で絞らず、phase: gas の全エントリを内蔵種にする。
#               Python (設計) の熱物性表は今も design の種だけを読む (composition.solver_builtin_names() は全気相種)。生成ブロックのエントリには書かない。
#   MW          [kg/mol]
#   intervals   温度区間の列。各区間 Tlo/Thi [K] と NASA-9 係数 a0..a8
#               (cp/R = a0/T^2 + a1/T + a2 + a3 T + a4 T^2 + a5 T^3 + a6 T^4、a7 は h、a8 は s° の積分定数)。
#               区間は連続 (前の Thi = 次の Tlo)。区間数は 1〜3 (THERMO_MAX_INTERVALS; 区間可変は #13-1)。
#               CEA 由来の種は手保守・生成ブロックとも CEA の区間数・区切りのまま (手保守の CEA 化は #13-3)。
#               設計側 (Python) は 200–1000–6000(–20000) K の種の先頭 2 区間だけを持ち、T > 6000 K の評価は例外にする。
#   LJ          {sigma [Å], eps_kB [K], dipole [D] (任意; 極性分子の双極子モーメント), source} または null
#               (輸送データなし: ソルバは physProp.transport の kinetic と、LJ を使う混合平均拡散 (viscMethod != 0 かつ
#               speciesDiffusionMethod 1) に使うと起動時に拒否する)。dipole は physProp.transport の kinetic (Brokaw の極性補正) だけが読む (#5t2)
#   pair_of     (phase: condensed のみ) 気液ペアの気相種の canonical ID。液相は気相と同じ MW で質量換算し、
#               気相と同じ datum オフセット (定数 R_u Δa7/MW, Δa7 = −h_abs,gas(Tref)/R_u) を足して L = h_v − h_l を作る (plan #10)
#   extension   (phase: condensed のみ) 区間外の延長規約 {below, above}。現在の実装が受け付けるのは
#               below: linear_cp_fd_at_Tlo (T<Tlo は h(Tlo) から一定 c_p,l = h(Tlo+0.5) − h(Tlo−0.5+1e-9) [1 K の差分] で線形)、
#               above: hold_at_Thi (T>Thi は h(Thi) で頭打ち)
#   atoms       元素組成 {元素: 個数} (診断用) または null (擬似種)
#   source      エントリの出典 (thermo = NASA-9 係数、MW)
#   deviations  CEA thermo.inp 直読みとの既知の差 (無ければ省略)
#
# 生成ブロック (#13-2, 2026-10-01): 末尾の BEGIN/END マーカの間は tools/cea_thermo_to_forge_species.py --write が
#   CEA thermo.inp と輸送データ (forge_transport_v1.yaml) から生成する (手で編集しない; --check で往復のビット一致を検査)。
#   対象は輸送データの種のうち thermo.inp に同名 (大小文字区別) があり、マーカの外 (手保守) に無い種。e- は除外。
#   LJ の出典は tools/cea_thermo_to_species_db.py の LJ 表 (Cantera h2o2/gri30 の transport) だけで、表に無い種は LJ: null。
# 名前 (id と別名) は大小文字を無視しても全エントリで一意 (ソルバが起動時に検査する; thermo.inp には CO/Co 等が実在)。
# =============================================================================
schema: forge_species_data_v1
provenance:
  cea_thermo_inp:
