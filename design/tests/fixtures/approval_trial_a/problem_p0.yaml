  M_design: 5.5   # カード M_exit
  wall_thermal: {mode: isothermal, Tw: 350.0}   # カード wall
  sizing: {method: throat, target_m: 0.105}   # カード throat.diameter_physical_m 0.21 m の半径 (物理スロート) で寸法を決めた

dv:   # Lc_mode: from_length の設計変数 (r_t 単位)
  L_total: {value: 72.44797343870998}   # = divergent_length_m 7.6 m / r_t (設計スロート x=0 → 物理出口)

geometry:
  R: 4.766314042020393   # = throat.curvature_radius_m 0.5 m / r_t (設計壁のスロートの曲率半径)
  r_inlet: 2.8597884252122356   # = inlet.radius_m 0.3 m / r_t
  L_U: 4.766314042020393   # = inlet.contraction_length_m 0.5 m / r_t (μ = L_U²/(R Δr) = 2.563 ≤ 20)
  L_pipe: 4.766314042020393   # = inlet.pipe_length_m 0.5 m / r_t
  Lc_mode: from_length   # 生成器: dv.L_total から L_c を解く
  L_total_tol: 0.004766314042020393   # = 長さ公差 0.001 m / 2 / r_t
  M_knot: 2.65   # 自動 (規則 coarse_min_theta_v2): 出力と同じ実効の入力 (r_t 0.10490286531519752 m、生産の網 n_axis_inv 4800・L_total_tol 0.004766 r_t) で選び直した値 = r_t の固定点に使った値 (θ_max 14.27503°、境目までの推定の距離 1.20; 粗い網 n_axis_inv 1200・L_total_tol 0.1 r_t の 0.05 の格子、谷 1 個のうち 1 個を生産の網で確認); 雛形の M_knot_factor 0.45 は使わない。要約は _card.M_knot_rule、掃引の表と全部の記録は card_log の M_knot_rule
