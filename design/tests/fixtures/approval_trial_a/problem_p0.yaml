  gamma: 1.29481   # 参照値: スロート T* の γ (semiperfect では NASA-9 が優先)
  cp: 1282.59   # 参照値: c_p(T*) [J/(kg K)]

deltastar_initializer:
  model: contur   # overrides で上書き (雛形/生成値: (無し))

spec:
  Pt: 3150000.0   # カード conditions.Pt [Pa]
  Tt: 1187.5   # カード conditions.Tt [K]
