mesh:
  meshFileName: "axi_nozzle.h5"
  valueFileName: "input.h5"

gpu: 1
solver: "SLAU"

physProp:
  isAxisymmetric: 1
  thermalMethod: 2
  viscMethod: 2
  visc : 1.8e-5
  thermCond: 0.0257
  cp : 1038.8
  gamma : 1.4
  species: [N2]

time:
  unsteady: 0
  dualTime: 0
  last:
    nStepOuter: 4000
  deltaT:
    control: 1
    dt: 0.00000001
    cfl: 0.6
    cfl_pseudo: 0.6
    dt_min: 0.000000001
    dt_max: 0.001
  outStepStart: 0
  outStepInterval: 4000
  timeIntegration: 3
  nStepInner: 1

space:
  convMethod: 1
  limiter: 2

turbulence:
  model: "sst"
  scalarDiffusion: 1
  dilatationCorrection: 2
  kInf: 1.0
  omegaInf: 1000.0

initial: "uniform_p101325_u10"
