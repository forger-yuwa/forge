mesh: {discretization: node, isAxisymmetric: 1, axisCentroidShift: 1,
  meshFileName: nozzle.h5, valueFileName: ic.h5}
gpu: 1
solver: SLAU
physProp:
  thermalMethod: 2
  viscMethod: 0
  visc: 0.0
  thermCond: 0.0
  cp: 1220.7
  gamma: 1.31526
  species: [MIXDRY, H2O]
  speciesDBFile: species_db.yaml
  thermoHrefTemp: 298.15
time:
  unsteady: 1
  dualTime: 1
  last: {nStepOuter: 100}
  deltaT: {control: 0, dt: 8.0e-06, cfl: 2.0, cfl_pseudo: 12.0, dt_min: 1e-9, dt_max: 0.001,
    blockDPLUR: 1, lowMachPrecond: 0, detectNaN: 1, monitorInterval: 10, speciesFaceReconstruction: 2,
    passiveScalarScheme: 1, passiveFct: 1, speciesImplicitCoupling: 1}
  outStepStart: 0
  outStepInterval: 100
  timeIntegration: 11
  nStepInner: 5
  bdfOrder: 2
  nSubIterDualTime: 20
space: {convMethod: 1, limiter: 1}
turbulence: {model: none}
initial: uniform_p101325_u10
condensation: {condensation: 1, nCondSpecies: 1, condModel: 1, condKantrowitz: 1,
  condGrowthModel: 0, condGasSpecies: 1, condLimiterMode: 1, condFloat: 1}
output: {level: 2}
