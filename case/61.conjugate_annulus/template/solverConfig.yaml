# case/61 V-ax2 同心円環 — ソルバ内連成の本 run (plan boundary-cht-axisymmetric-fem2d §6 V-ax2)。
# 静止ガス r_a=5 mm .. r_b=10 mm (k_f 0.0241 一定)、内壁 350 K 等温、外壁 = 共役壁 (固体殻 r_b..r_c=20 mm、
# k_s 0.027、外面 Robin h=1e8 / T_c=300 K)。軸は含まない。
# **一様 IC (流体 325 K・静止、固体も 325 K = 共役壁の Ts 初期値) から単一区間で回す** (V-ax2「流体残差」)。
# 数値設定の理由は case/61 README「設定値と理由」。
mesh: {discretization: "node", nodeWallDirichlet: 1, isAxisymmetric: 1, axisymMethod: 0,
       meshFileName: "mesh.h5", valueFileName: "mesh.h5"}
gpu: 1
detectNaN: 1
detectNaNInterval: 100
solver: "SLAU"
physProp:
  thermalMethod: 0
  viscMethod: 0          # 定数 visc / thermCond (解析解の k_f を厳密にする)
  thermCondMethod: 0
  visc: 1.81e-5
  thermCond: 0.0241
  cp: 1004.5
  gamma: 1.4
time:
  unsteady: 0
  dualTime: 0
  last: {nStepOuter: 300000}
  deltaT: {control: 1, dt: 1.0e-8, cfl: 5.0, cfl_pseudo: 5.0, blockDPLUR: 1, implicitRelax: 0.5,
           dt_min: 1.0e-11, dt_max: 1.0}
  outStepStart: 0
  outStepInterval: 10000
  timeIntegration: 11
  nStepInner: 5
space:
  convMethod: 1
  limiter: 2
  # リミッタの基準値を IC (静止 325 K・p0) の自動値に固定する (再開しても作用素が変わらない。V-ax4 の前提)
  limiterRoRef: 0.01086303964
  limiterPRef: 1014.467794
  limiterARef: 361.5785923
turbulence: {model: "none"}
output: {level: 1, interfaceDiag: 1}
conjugate:
  mode: fem2d
  solid: solid.h5
  flux: q_eff
  warmup: 20000           # 合格構成 (2026-09-27)。200 は壁温が下がってから上がる静止ガスの過渡を発散検知が誤検知した (README の run 一覧)
  interval: 50            # case/52・case/58 の基準 (K = 50)
  flux_avg: 1             # 静止ガスに周期振動は無い
  Df_scale: 5.0           # case/58 V6′ の合否 run (df5_i50) と同じ。収束は遅くなるが nStepOuter で吸収する
  refactorDT: 1.0
  node_log: 1             # 全界面節点の毎更新ログ (準定常の系列・G-if の素材)
  # G-if の登録値 (plan §6 V-ax2。動かさない)
  gate: {eps_abs_Wm2: 0.46, eps_rel: 1.0e-3, dT_K: 2.0e-3, tol_solid: 1.0e-9, n_consec: 80}
initial: "uniform_p101325_u10"   # 変換器用の名前。VALUE は gen_mesh.py が静止 325 K にパッチ済み
