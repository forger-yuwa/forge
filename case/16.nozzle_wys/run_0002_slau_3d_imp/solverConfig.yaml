mesh:
  meshFileName: "nozzle_3d.h5"
  valueFileName: "nozzle_3d.h5"
gpu: 1
solver: "SLAU"
physProp:
  thermalMethod: 0
  viscMethod: 0          # 0: inviscid (Euler) — slip 壁で起動を安定化
  visc : 0.0000175      # N2 ~ (Euler では未使用)
  thermCond: 0.0241
  cp : 1039.0           # N2: gamma*R/(gamma-1), R_N2=296.8
  gamma : 1.4
time:
  unsteady: 0
  dualTime: 0
  last:
    nStepOuter: 12000
    time: 1.00
  deltaT:
    control: 1
    dt: 0.00001
    cfl: 1.0
    cfl_pseudo: 5
    implicitRelax: 1.0
    blockDPLUR: 1
    dt_min: 0.00000001
    dt_max: 1.0
    detectNaN: 1
  outStepInterval: 2000
  outStepStart: 0
  timeIntegration: 11
  nStepInner: 20
space:
  convMethod: 0          # 1st-order upwind for robust startup
  limiter: 0
turbulence:
  model: "none"
initial: "nozzle_wys"
