mesh:
  discretization: "cell"
  isAxisymmetric: 0
  nodeWallDirichlet: 1
  meshFileName: "nozzle_user_2d.h5"
  valueFileName: "nozzle_user_2d.h5"
gpu: 1
solver: "SLAU"
physProp:
  thermalMethod: 2
  viscMethod: 0
  visc: 0.0
  thermCond: 0.0
  cp: 1039.0
  gamma: 1.4
  species: ["MIXDRY", "H2O"]
  speciesDBFile: "species_db.yaml"
  thermoHrefTemp: 298.15
time:
  unsteady: 0
  dualTime: 0
  last: {nStepOuter: 12000}
  deltaT: {control: 1, dt: 0.00001, cfl: 2.0, cfl_pseudo: 2.0, implicitRelax: 1.0, blockDPLUR: 1,
           dt_min: 0.00000001, dt_max: 1.0, detectNaN: 1}
  outStepInterval: 3000
  outStepStart: 0
  timeIntegration: 11
  nStepInner: 5
space: {convMethod: 1, limiter: 2}
turbulence: {model: "none"}
initial: "nozzle_wys"
