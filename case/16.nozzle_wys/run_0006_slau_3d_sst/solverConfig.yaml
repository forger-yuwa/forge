mesh:
  meshFileName: "nozzle_3d_sst.h5"
  valueFileName: "nozzle_3d_sst.h5"
gpu: 1
solver: "SLAU"
physProp:
  thermalMethod: 0
  viscMethod: 1          # 1: 粘性 (laminar Navier-Stokes)
  visc : 0.0000175       # N2 動粘性 ~1.75e-5 Pa s
  thermCond: 0.0241
  cp : 1039.0
  gamma : 1.4
time:
  unsteady: 0
  dualTime: 0
  last:
    nStepOuter: 15000
    time: 1.00
  deltaT:
    control: 1
    dt: 0.00001
    cfl: 1.0
    cfl_pseudo: 1.0
    implicitRelax: 1.0
    blockDPLUR: 1
    dt_min: 0.00000001
    dt_max: 1.0
    detectNaN: 1
  outStepInterval: 3000
  outStepStart: 0
  timeIntegration: 11
  nStepInner: 20
space:
  convMethod: 0
  limiter: 0
turbulence:
  model: "sst"
  scalarDiffusion: 1
  dilatationCorrection: 2
  kInf: 1.0
  omegaInf: 1000.0
initial: "nozzle_wys"
