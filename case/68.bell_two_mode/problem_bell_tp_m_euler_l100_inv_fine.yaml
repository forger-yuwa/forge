# forge_design 問題定義 — ③ベル (M) L100 の δ* 補正の**狙い** (plan tooling-nozzle-bell-two-mode §5.1 #7 (7b-4) の事前登録):
# 補正後の非粘性壁 (ε_inv = (√50 − δ_r,e)² ≈ 48.0905、δ_r,e = kδ·C(x_E) = 0.13633 r_t、kδ 1.0289・C = contur_v2 [run_0018 の縁])
# を TP の Euler で回す。壁ファイル rao_m/rao_corr_parts/L100_inv_eps48p0905_pin_n321_wall.npz (ピン版 L100 と同じ CFD ピンの初期線
# [凍結源 run_0015 の res_30000、n 321]・同じ L・円弧 kernel; 台本 rao_m/run_corrected_wall.py design)。
# 格子・段・Euler 設定は problem_bell_tp_m_euler_l100_pin.yaml (run_0018) と同じ (ε だけ違うので出口半径は √ε_inv)。
# 格子 ×1.5 (ni 1801・nj 181、run_0017 と同じ倍率) — 不確かさの格子の項 (§5.1 #7 (7b-4))。
# 用途: 補正壁の NS (problem_bell_tp_m_ns_l100_corr_vext/vzero.yaml) の壁圧・軸上 Mach・出口の Mach 分布の誤差の基準。
name: bell_tp_m_euler_inv_L100_corr_fine
type: thruster_bell
gas:
  model: semiperfect
  exhaust: exhaust_lox_lh2_pc100_of6.yaml

spec:
  p_ambient: 0.0     # 真空の設計点 [Pa]
  r_throat: 0.14     # スロート半径 [m] (plan §8-1 の仮値)
  eps: 48.09052527964615   # ε_inv = (√50 − kδ·C(x_E))² (補正後の非粘性壁)

dv:
  L_over_rt: {value: 22.657533530077966, fixed: true}   # 15° 円錐長の 100 %。壁ファイルが決める L との照合用 (相対 1e-9)

geometry:
  bell_mode: moc_rao
  rao_wall_file: rao_m/rao_corr_parts/L100_inv_eps48p0905_pin_n321_wall.npz
  R_t: 1.0
  contraction_ratio: 3.0
  L_U: 3.0
  L_pipe: 1.0

mesh:
  discretization: node
  ni: 1801
  nj: 181
  wall_first_frac: 0.005           # 全断面で一様 (壁に寄せない)
  throat_refine: 8.0
  throat_width: 3.0

evaluate:
  model: euler
  stages: [soft, mid, main]
  stage_steps: {soft: 2000, mid: 2000}
  nStepOuter: 30000          # 本段
  outStepInterval: 1500      # 本段の res の間隔 = 本段長の 1/20
  cfl_main: 4.0
