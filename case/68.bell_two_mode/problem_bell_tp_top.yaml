# forge_design 問題定義 — ③ベル 2 モード比較の共通評価器 (TP) の確認用 (plan tooling-nozzle-bell-two-mode §5.1 #2a)。
# ガス = LOX/LH2・燃焼室圧 10 MPa・O/F 6 の燃焼室平衡組成を凍結した TP (単一の lump 擬似種 EXH)。
#   組成・燃焼室温度 (spec.Tt)・燃焼室圧 (spec.Pt) は排気ファイル (CEA2 から生成) が単一ソースなので、ここには書かない。
#   排気ファイルの作り直し: design/ で
#     python -m forge_design.gas.rocket_exhaust --supar 10,25,50,100 --out ../case/68.bell_two_mode/exhaust_lox_lh2_pc100_of6.yaml
# 形状 = 既存の TOP (Phase 2 の族) を ε 50 に合わせた仮の 1 点 (θn 32°・θe 9°・L 18 r_t ≈ 15° 円錐の 80 %)。
#   評価器の確認用で、設計の比較ではない (2 モードの壁は §4.2 の C2 構成で別に作る)。
# 作動点 = 真空の設計点 (p_ambient 0、出口は outflow)。壁 = 断熱・低 Re SST (wallTreatmentSST 0)。
name: bell_tp_top_eps50
type: thruster_bell
gas:
  model: semiperfect
  exhaust: exhaust_lox_lh2_pc100_of6.yaml
  # 種ごとの輸送物性 (viscMethod 2 + physProp.transport)。lump EXH の構成実種ごと (H2O は IAPWS 希薄気体 + CEA)
  transport: {H2O: custom:h2o_iapws_cea_v1, H2: cea, OH: cea, H: cea, O: cea, O2: cea}

spec:
  p_ambient: 0.0     # 真空の設計点 [Pa] (推力の p_a; 出口 BC は outflow なので使わない)
  r_throat: 0.14     # スロート半径 [m] (plan §8-1 の仮値)
  eps: 50.0          # 面積比 Ae/At

dv:
  theta_a_deg: {value: 32.0, min: 20.0, max: 40.0}  # 初期膨張角 θn
  theta_e_deg: {value: 9.0,  min: 4.0,  max: 14.0}  # 出口壁角 θe
  L_over_rt:   {value: 18.0, min: 12.0, max: 24.0}  # スロート → 出口の軸長 / r_t

geometry:
  bell_type: top
  r_inlet: 2.5
  L_pipe: 0.5
  L_contract: 3.0
  Ru: 1.5
  Rd: 0.4
  phi_u_deg: 25.0

mesh:
  discretization: node
  ni: 561
  nj: 121
  wall_first_frac: 2.5e-5   # 第一セル厚 / 局所半径 (スロートで 3.5 µm; y1+ ≈ 5 の見積り — 壁解像の判定は #2b のゲート (v))
  throat_refine: 3.0
  ar_max: 1000

evaluate:
  turbulence: sst
  nStepOuter: 1000
  outStepInterval: 250
  cfl_main: 4.0
  objectives: [eta_cf, length]
