# forge_design 問題定義 — ③ベル 2 モード比較の共通評価器 (TP) の壁法線の近壁層の確認用 (plan tooling-nozzle-bell-two-mode §4.1 (v)・§5.1 #2d)。
# 形状・ガス・作動点は problem_bell_tp_top_2b.yaml (#2b の基準ケース) と同じ。違いは mesh と本段の長さ・出力間隔:
#   - 近壁を壁法線の層にする (mesh2d の wall_normal_layer [d_n, d_b] = 局所半径比 0.02・0.8、case/45 の冷却壁の格子と同じ値)。
#     入口・出口の面は平面のまま (両端 20 断面で層を半径方向の配置へ戻す wall_normal_end_stations; ベルの出口は θ_e 9° なので
#     法線の層のままだと出口の節点が下流へずれる)。
#   - y1+ ≤ 1 のためにスロート・収縮部・入口直管の第一セル厚を 3.5e-6 r_w (スロートで 0.49 µm)、下流は x 0.3〜14 r_t で 2.5e-5 r_w
#     へ smoothstep (出口近くの AR を 1000 未満にして、半径方向へ戻す区間に AR > 1000 のセルを置かない)。
#   - AGENTS.md の AR ≤ 5000 の例外 (壁法線の構造層) を使う: ar_max 5000。条件 (AR > 1000 の全セルでスキュー ≤ 0.1、入口・出口面は平面)
#     は runner が MESH_AR_RELAX.json に検査して残す (check_mesh_quality.py --ar-max 5000 は全域一律なので条件を保証しない)。
#   - 本段の出力間隔は本段長の 1/20 (準定常ゲート (ii) の末尾窓に 8 点以上)。
# python -m forge_design.evaluate.runner <この YAML> <run> --staged (継続は --continue-from <run>)、
# ゲートは python -m forge_design.opt.driver <この YAML> <run> --gate-only。
name: bell_tp_top_eps50_wn
type: thruster_bell
gas:
  model: semiperfect
  exhaust: exhaust_lox_lh2_pc100_of6.yaml
  transport: {H2O: custom:h2o_iapws_cea_v1, H2: cea, OH: cea, H: cea, O: cea, O2: cea}

spec:
  p_ambient: 0.0     # 真空の設計点 [Pa]
  r_throat: 0.14     # スロート半径 [m] (plan §8-1 の仮値)
  eps: 50.0

dv:
  theta_a_deg: {value: 32.0, min: 20.0, max: 40.0}
  theta_e_deg: {value: 9.0,  min: 4.0,  max: 14.0}
  L_over_rt:   {value: 18.0, min: 12.0, max: 24.0}

geometry:
  bell_type: top
  r_inlet: 2.5
  L_pipe: 0.5
  L_contract: 3.0
  Ru: 1.5
  Rd: 0.4
  phi_u_deg: 25.0

mesh:
  discretization: node
  ni: 1201
  nj: 121
  wall_first_frac: 2.5e-5          # 下流 (x ≥ wall_first_blend_x1) の第一セル厚 / 局所半径 (出口で 25 µm、AR 約 290)
  wall_first_frac_throat: 3.5e-6   # x ≤ wall_first_blend_x0 (wall_first_up_* 無し = 上流は全域この値): スロートで 0.49 µm、入口直管で 1.2 µm
  wall_first_blend_x0: 0.3
  wall_first_blend_x1: 14.0
  throat_refine: 8.0
  throat_width: 3.0
  wall_normal_layer: [0.02, 0.8]   # 近壁を壁法線に (局所半径比 d_n, d_b)
  wall_normal_end_stations: 20     # 入口・出口の 20 断面で半径方向の配置へ戻す (面を平面に保つ)
  ar_max: 5000                     # AR 緩和 (≤5000): 壁法線の構造層 (AGENTS.md の例外)

evaluate:
  turbulence: sst
  stages: [soft, mid, main]
  stage_steps: {soft: 2000, mid: 2000}
  nStepOuter: 60000          # 本段 (run_0005・run_0007 の本段の総長と同じ)
  outStepInterval: 3000      # 本段の res の間隔 = 本段長の 1/20 (推力の時系列 20 点、末尾窓 8 点)
  cfl_main: 4.0
  objectives: [eta_cf, length]
