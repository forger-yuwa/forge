% case/52 共役スラブ — SU2 multizone CHT の親設定
% plan boundary-conjugate-heat-transfer §6 V2 / procedures/su2-cross-check.md
SOLVER= MULTIPHYSICS
MATH_PROBLEM= DIRECT
CONFIG_LIST= ( fluid.cfg, solid.cfg )
MULTIZONE_MESH= NO

MARKER_ZONE_INTERFACE= ( fluid_interface, solid_interface )
MARKER_CHT_INTERFACE= ( fluid_interface, solid_interface )

TIME_DOMAIN= NO
OUTER_ITER= 3000
% **早期終了させない**。静止流体の BGS 残差は最初から -23 で、既定の判定に任せると
% 固体が -0.62 のまま 11 外反復で止まる (2026-09-24 実測)。固定回数まで回して両ゾーンを見る。
CONV_FIELD= AVG_BGS_RES[1]
CONV_RESIDUAL_MINVAL= -14
CONV_STARTITER= 50

HISTORY_OUTPUT= ( ITER, BGS_RES[0], BGS_RES[1], HEAT[0], HEAT[1] )
OUTPUT_FILES= ( RESTART_ASCII, PARAVIEW_MULTIBLOCK )
SCREEN_OUTPUT= ( OUTER_ITER, AVG_BGS_RES[0], AVG_BGS_RES[1] )
OUTPUT_WRT_FREQ= 500
