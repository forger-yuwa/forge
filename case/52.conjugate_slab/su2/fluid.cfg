% case/52 共役スラブ — 流体ゾーン (静止・純伝導)
% plan boundary-conjugate-heat-transfer §6 V2。forge の V1 と同じ問題。
SOLVER= INC_NAVIER_STOKES
KIND_TURB_MODEL= NONE
INC_ENERGY_EQUATION= YES
INC_NONDIM= DIMENSIONAL

% 静止流体。定常解 (q, T_w) は密度・c_p に依らない (直列抵抗だけで決まる)。
INC_DENSITY_MODEL= CONSTANT
INC_DENSITY_INIT= 0.0106
INC_VELOCITY_INIT= ( 0.0, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 333.0
SPECIFIC_HEAT_CP= 1004.5

% **k_f = 0.0241 W/mK 一定** (forge の case/52 と同じ)。Prandtl 経由にすると粘性に引きずられるので
% CONSTANT_CONDUCTIVITY を使う。
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.8e-05
CONDUCTIVITY_MODEL= CONSTANT_CONDUCTIVITY
THERMAL_CONDUCTIVITY_CONSTANT= 0.0241

MARKER_ISOTHERMAL= ( fluid_top, 350.0 )
MARKER_CHT_INTERFACE= ( fluid_interface )
MARKER_SYM= ( fluid_left, fluid_right )
MARKER_PLOTTING= ( fluid_interface )
MARKER_MONITORING= ( NONE )

CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 100.0
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-14
LINEAR_SOLVER_ITER= 20
CONV_FIELD= RMS_PRESSURE
CONV_RESIDUAL_MINVAL= -14
CONV_STARTITER= 10

VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
MESH_FILENAME= fluid.su2
MESH_FORMAT= SU2
