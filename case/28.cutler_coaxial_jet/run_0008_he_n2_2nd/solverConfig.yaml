mesh:
  meshFileName: "coaxial.h5"
  valueFileName: "restart.h5"
gpu: 1
solver: "SLAU"
physProp:
  isAxisymmetric: 1
  thermalMethod: 2          # 多成分 thermally-perfect gas
  viscMethod: 0             # まず非粘性で BC + 組成移流の健全性を確認
  visc : 1.8e-5
  thermCond: 0.0257
  cp : 1004.5
  gamma : 1.4
  species: [He, N2]         # index0=He (中心ジェット), index1=N2 (coflow/ambient)
time:
  unsteady: 0
  dualTime: 0
  last:
    nStepOuter: 2000
  deltaT:
    control: 1
    dt: 0.00000001
    cfl: 0.3
    cfl_pseudo: 0.3
    dt_min: 0.000000001
    dt_max: 0.001
  outStepStart: 0
  outStepInterval: 500
  timeIntegration: 3        # explicit RK3 (超音速 TP の安定手法)
  nStepInner: 1
space:
  convMethod: 1             # 2次風上 (1次解からリスタート)
  limiter: 2
turbulence:
  model: "none"
  scalarDiffusion: 1
  dilatationCorrection: 2
  kInf: 1.0
  omegaInf: 1000.0
initial: "uniform_p101325_u10"
