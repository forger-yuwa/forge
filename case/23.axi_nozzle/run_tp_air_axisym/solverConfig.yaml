mesh:
  meshFileName: "axi_nozzle.h5"
  valueFileName: "input_tp.h5"


gpu: 1 # 0:off , 1:on

solver: "SLAU" # SLAU, ROE, AUSM+, AUSM+UP, KEEP_SLAU

physProp:
  isAxisymmetric: 1
  thermalMethod: 2 # 0:calorically perfect
  viscMethod: 0 # 0:use visc , 1:sutherland
  visc : 1.8e-5     # [Pa*s]
  thermCond: 0.0257 # [W/(mK)]
  cp : 1004.5       # [J/(kgK)]
  gamma : 1.4
  species: [AIR]

time:
  unsteady: 0 # 0:steady , 1:unsteady
  dualTime: 0 # 1:use pseudo time for unsteady
  last:
    nStepOuter: 3000
    time: 1.00 # [second]
  deltaT:
    control: 1 # 0:use dt , 1:use cfl
    dt: 0.00000001
    cfl: 0.3
    cfl_pseudo: 0.3
    dt_min: 0.000000001
    dt_max: 1.0
  outStepStart: 0
  outStepInterval: 1500
  timeIntegration: 3 # 1:Euler explicit, 3:3rd TVD Runge Explicit, 4:4th runge exp, 11:implicit
  nStepInner: 1

space:
  convMethod: 2 # 0:1stUp 1:2ndup 2:MUSCL
  limiter: 2    # 1:barth 2:venkata

turbulence:
  model: "none"
  kInf: 1.0
  omegaInf: 1000.0

initial: "uniform_p101325_u10"
