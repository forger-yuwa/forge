mesh:
  meshFileName: "supercritical.h5"

gpu: 1 # 0:off, 1:on

solver: "smac" # smac , simple , simplec , fractionalStep

physProp:
  visc : 0.000018 #[Pa*s]
  thermCond: 0.0241 # [W/(mK)]
  cp : 1006.0 # [J/(kgK)]

time: 
  last: 
    nStepOuter: 1000
    time: 0.1 # [second]
  deltaT:  
    control: 0 # 0:use dt , 1:use cfl
    dt: 0.00005
    cfl: 0.5 
  outStepInterval: 50

space: 
  convMethod: 1 # 1:"1stUp", 2:"2ndUp"

