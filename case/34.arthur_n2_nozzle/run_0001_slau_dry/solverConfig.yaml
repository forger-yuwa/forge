mesh:
  meshFileName: "arthur_nozzle.h5"
  valueFileName: "arthur_nozzle.h5"
gpu: 1
solver: "SLAU"
physProp:
  thermalMethod: 0
  viscMethod: 0          # 0: inviscid (Euler) — Arthur の source-flow 検証は非粘性 dry 膨張
  visc : 0.0000178       # N2 (Euler では未使用)
  thermCond: 0.0258
  cp : 1038.8            # N2: gamma*R/(gamma-1), R_N2=296.8
  gamma : 1.4
time:
  unsteady: 0
  dualTime: 0
  last:
    nStepOuter: 20000
    time: 1.00
  deltaT:
    control: 1
    dt: 0.00001
    cfl: 1.0
    cfl_pseudo: 5
    implicitRelax: 1.0
    blockDPLUR: 1
    dt_min: 0.00000001
    dt_max: 1.0
    detectNaN: 1
  outStepInterval: 4000
  outStepStart: 0
  timeIntegration: 11
  nStepInner: 20
space:
  convMethod: 0          # 1st-order upwind for robust startup
  limiter: 0
turbulence:
  model: "none"
initial: "arthur_n2"
