# ⑤ SERN S6 多作動点 MOO (初回キャンペーン: cell Euler slip で安価に回す。RANS 化は評価器差し替えのみ)。
# dv = key point (M_c, f) + ランプ初期角 + カウル初期角 + カウル長。作動点 = 巡航 (M∞6, 高 NPR) と加速 (M∞4, 低 NPR)。
# 目的: f1 = −(0.6 C_T,cruise + 0.4 C_T,accel), f2 = L_ramp/H。C_M は機体 CG 相当 (x_ref = −20H) で記録。
name: sern_moo_euler
type: sern_2d
gas: {gamma: 1.4, cp: 1004.5}
spec:
  H_m: 0.1
  inflow: {mode: supersonic, M_in: 2.5, p_in: 20000.0, T_in: 900.0}
  external: {M_inf: 6.0, p_inf: 1000.0, T_inf: 220.0}
  operating_points:
    - {name: cruise, weight: 0.6, external: {M_inf: 6.0, p_inf: 1000.0, T_inf: 220.0}}
    - {name: accel,  weight: 0.4, external: {M_inf: 4.0, p_inf: 3000.0, T_inf: 230.0}}
  moment_ref: [-20.0, 0.0]
dv:
  M_c:           {min: 3.2, max: 4.4, value: 3.9}
  f:             {min: 0.35, max: 0.60, value: 0.45}
  theta_r0_deg:  {min: 10.0, max: 20.0, value: 15.0}
  theta_c0_deg:  {min: 2.0, max: 8.0, value: 5.0}
  L_cowl:        {min: 0.6, max: 1.6, value: 1.0}
geometry: {x_max_kernel: 9.0, nj_moc: 301, dx_moc: 2.0e-3, nj_moc_probe: 151, dx_moc_probe: 4.0e-3, L_ramp_max: 20.0}
mesh: {discretization: cell, ni_up: 16, ni_noz: 100, ni_plume: 180, nj_top: 81, nj_bot: 51, L_up: 0.5, x_out_extra: 2.0, bot_depth: 3.0, first_wall_frac: 2.0e-3}
evaluate: {model: euler, nStepOuter: 3000, cfl_main: 4.0, outStepInterval: 500}
opt: {soft_steps: 1500}
