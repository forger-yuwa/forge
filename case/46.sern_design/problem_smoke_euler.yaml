# ⑤ SERN スモーク: S1 テスト 4 と同じ設計 (M_in 2.5, ランプ 15°, カウル 5°/L 1H, p_ext/p_in 0.05, key point M_c 3.9 / f 0.45)
# を forge 平面 2D Euler (slip) で評価し、MOC の C_T と照合する (plan S4(a))。
name: sern_smoke_euler
type: sern_2d
gas: {gamma: 1.4, cp: 1004.5}
spec:
  H_m: 0.1
  inflow: {mode: supersonic, M_in: 2.5, p_in: 20000.0, T_in: 900.0}
  external: {M_inf: 6.0, p_inf: 1000.0, T_inf: 220.0}
  moment_ref: [0.0, 0.0]
dv:
  M_c: 3.9
  f: 0.45
  theta_r0_deg: 15.0
  theta_c0_deg: 5.0
  L_cowl: 1.0
geometry: {x_max_kernel: 9.0, nj_moc: 301, dx_moc: 2.0e-3}
mesh: {discretization: cell, ni_up: 16, ni_noz: 120, ni_plume: 220, nj_top: 101, nj_bot: 61, L_up: 0.5, x_out_extra: 2.0, bot_depth: 3.0, first_wall_frac: 2.0e-3}
evaluate: {model: euler, nStepOuter: 6000, cfl_main: 4.0, outStepInterval: 500}
