# ⑤ SERN S6 多作動点 MOO — 作動点を**サイクル値**で定義した生産構成 (plan §4.10、2026-09-05)。
# アンカー = NASA TM X-71972 TABLE 1 (定動圧 1500 psf 経路の station 3 = 燃焼器出口) + CEA2 で γ/M_3 を補完。
# 導出は case/46.sern_design/cea/tmx_operating_points.py (CEA 入出力は同 cea/)。
#
#   設計点 = M∞6 powered (spec.inflow / spec.external / gas)。逆設計はこれで固定 (作動点で形状は変えない)。
#   作動点 = m6_on (巡航, NPR 35.4, w 0.5) / m10_on (最大 M, NPR 56.4, w 0.3) / m4_off (燃料遮断, NPR 2.8, w 0.2)
#   低 NPR 点は「低速飛行」ではなく**燃料遮断 (power-off)**。M_3 = 2.91 で超音速なので sonic_throat 不要。
#
# 目的 = −(摩擦込み C_T の重み付き平均), L_ramp/H。制約 C_M,w (x_ref −20H) ≥ −2.5。剥離割合を台帳に記録。
name: sern_3d_prod_m6on_g4
type: sern_2d
gas:                       # **生産条件** (2026-09-20, R5i / codex plan-2 M1): 2D 生産 YAML と同一。
                           # 排気 = CEA 凍結組成の擬似種 EXH (thermalMethod 2)、外気 = 空気 AIR。
                           # 設計点は m6_on の凍結 γ(T3)/cp(T3)。旧 3D YAML は `model` 省略で CPG になっていた
  model: frozen_tp
  thermo_href_temp: 298.15
  gamma: 1.2470
  cp: 1718.5
spec:
  wall_thermal: {mode: isothermal, Tw: 1000.0}   # **生産条件** (R5i)。断熱だと回復温度が非物理になり
                                                 # 残差がプラトーする (2D run_0103 で等温 1000 K により 3.5 桁低下)
  H_m: 0.1
  inflow:                  # 設計点 = 燃焼器出口 (TM X-71972 station 3, M∞6 φ=1)
    mode: supersonic
    M_in: 1.6308
    p_in: 101027.0
    T_in: 2328.0
  external:                # 設計点 = 自由流 (q̄ 71850 N/m^2 → h 24.2 km)
    M_inf: 6.0
    p_inf: 2851.0
    T_inf: 220.8
  operating_points:
  - name: m6_on
    weight: 1.0
    external: {M_inf: 6.0, p_inf: 2851.0, T_inf: 220.8}
    inflow: {M_in: 1.6308, p_in: 101027.0, T_in: 2328.0}
    gas: {gamma: 1.2470, cp: 1718.5,
          composition: {'N2': 0.6389, 'H2O': 0.32695, 'H2': 0.01251, 'Ar': 0.00767, 'OH': 0.00604, 'O2': 0.00398, 'NO': 0.00206, 'H': 0.00125, 'O': 0.00037, 'CO2': 0.00021, 'CO': 0.00005}}
  moment_ref:
  - -20.0
  - 0.0
dv:
  M_c: 2.9
  f: 0.45
  theta_r0_deg: 15.0
  theta_c0_deg: 5.0
  L_cowl: 1.2
geometry:
  x_max_kernel: 20.0       # L_cowl 上限 4.5 に合わせて広げる (打ち切りは key point で効く)
  nj_moc: 301
  dx_moc: 0.002
  nj_moc_probe: 151
  dx_moc_probe: 0.004
  L_ramp_max: 20.0         # NASA 基準形 18.5 H と同スケール
mesh:
  discretization: node
  cowl_thickness: 0.005    # カウル TE のせん断層で ω→inf を防ぐ数値措置。0 は m4_off でも落ち (run_0035)、2e-3 は m10_on で落ちる
                           # (run_0042)。5e-3 で 3 作動点とも通る (run_0043)。1e-2 と力係数は 0.3 % 以内で同じ = 物理は動かない
  ni_up: 16
  ni_noz: 160              # L_ramp ~10 H に対する解像度補償 (旧 100 は L_ramp ~4 H 前提)
  ni_plume: 180
  nj_top: 81
  nj_bot: 51
  L_up: 0.5
  x_out_extra: 2.0
  bot_depth: 3.0
  first_wall_frac: 0.004
  ext_top: 1               # ランプ側外部流 (機体上面・base・後流 + 自由流バンド, plan §4.11)。無いと過膨張でも剥離が起きない
  top_depth: 2.0
  nj_ext_top: 67   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認)
  nj_wake: 9
  vehicle_clearance: 0.06        # 物理値 (旧実装は 0.02 と書いて max(0.02, 3*first_top_frac) = 0.06 に膨らませていた)
  ar_max: 5000            # **AR 緩和 (≤5000)**: 壁法線に沿った構造格子の境界層セルに限る
                          # (AGENTS.md「メッシュ品質チェック」2026-09-12 ユーザ決定)。
                          # 実測 AR max 4819 / p99 995 / skew max 0.466 (>0.90 は 0 セル)
  first_top_frac: 1.5e-04   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認)
  vehicle_taper: 0.35     # 機体後端テーパ長 = L_ramp の 35 %。係数は smoothstep (C¹) — 線形 clip はテーパ開始点で
                          # 上面が水平から不連続に折れ、M∞10 のスリップ壁上の凸角として ω 発散した (run_0071 inf_00/01)
  ramp_fillet: 0.1        # ランプ膨張角部 (x=0) の丸め半径 /H。鋭角だと SST が θ_r0 ≳ 18° で roOmega 発散 (run_0055-0057)。
                          # 曲率ジャンプ 1010 → 12.5、壁の持ち上げは最大 0.0019 H。NASA TM X-71972 も小半径で接続している
evaluate:
  top_out_kind: slip       # 3D は top_out を slip 壁 (ランプ延長) にする (run_0027 で確立)
  model: sst
  nStepOuter: 4000
  p_min: 20.0              # EOS 圧力床 [Pa]。既定 1.0 Pa は m10_on の p∞ (1026 Pa) の 1/1000 で低すぎ、
                           # 機体上面 boat-tail の膨張で床を割ったノードが負密度に転落 → 圧力暴走 → ω 発散した
                           # (run_0075 で順序を確定)。20 Pa と 100 Pa で解は完全に同一 (C_T 0.9187, C_M −0.266,
                           # run_0077) なので、床は過渡の一瞬を守るだけで収束解には触れていない。所要も 150→32 s
  cfl_main: 0.25           # **壁解像メッシュ用** (R5d 段階1, plan sern-3d §4.33): 第 1 層を 4.0e-04 → 1.6e-05 m と
                           # 25 倍薄くすると剛性が上がり、0.5 は本段 step 97 で発散する (`rms_roOmega` 先行, run_0413)。
                           # 以下は粗メッシュでの旧根拠: 1.0 は限界的で、同一メッシュ・同一 config でも run により m10_on が step 171 で発散した
                           # (run_0048 成功 / run_0049 失敗)。0.5 で m10_on 2 回とも同一値、答えは 1.0 と一致 (run_0050-0053)
  outStepInterval: 500
opt:
  soft_steps: 2000
  soft_cfl: 0.2            # soft 段 CFL。既定 0.5 では m10_on が入口面∩カウル外面の角で step 3 発散 (run_0041)
  warm_lam_steps: 2000     # soft 段の前に層流暖機 (turbulence none)。カウル後縁のせん断層で SST が発散するのを防ぐ
  warm_lam_cfl: 0.2        # (板厚では m4_off と m10_on で要求が逆転して解けなかった。run_0046-0048)
  mid_steps: 2000          # soft と本段の間に 2 次 + soft CFL の段 (次数と CFL を同時に上げない)
  warm_adapt_steps: 500    # warm start 後の適応段 (1 次, soft CFL)。BC の違いを馴染ませる
  cm_min: -7.0             # 重み付き C_M (x_ref −20H) の下限。設計点 MOC C_M の dv 箱分布 (sweep_moc_dv_cycle3op.log: p10 −10.7 / med −6.9 /
                           # p90 −2.5) と重み付き比 ≈0.7 (m10_on/m4_off で緩む) から、最悪 ~15 % を落とす値。旧 −2.5 は L 3.8H 前提で候補が全滅する
mesh3d:
  W: 2.0
  Z_ext: 1.5
  L_sw: 0.8                # カウル後縁と側壁後縁を分離する (run_0082 で 3D SST が通る条件)
  nz_in: 25   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認)
  nz_out: 32   # R5o: 外側 z の最粗辺が AR を律速するので細分 (plan sern-3d §4.41)
  ni_up: 10
  ni_noz: 90
  ni_plume: 153   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認)
  nj_top: 83   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認)
  nj_bot: 65   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認)
  first_wall_frac: 4.0e-05   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認)
  first_wall_frac_far: 4.0e-03   # 壁が終わった下流は粗いまま (plan sern-3d §4.41)
  wall_frac_blend_len: 3.0       # ブレンドの物理長 /H。**0.5 では station あたり 1.78 倍で skew 0.933 が出た** (plan sern-3d §4.41)
  first_z_frac: 4.0e-03   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認)
  first_wake_frac: 1.7e-04   # R5d 段階1: **y 法線壁のみ**壁解像 (plan sern-3d §4.32)。側壁 (z 法線) は現行のまま — z を細くすると AR が 5000 を超えるため (probB/probC で確認) (vehicle_base)
