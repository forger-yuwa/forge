# ⑤ SERN S6 多作動点 MOO — 生産構成 (plan §4.10) の **R3 版 (2026-09-13)**: 排気 = CEA 凍結組成 TP 擬似種、外気 = 空気。
# codex C2 (外気に排気の γ,R → 外部動圧 −15 %) の是正。M_in は凍結音速 (V3/a_fr) で、CPG 版より 2–3 % 低い。
# アンカー = NASA TM X-71972 TABLE 1 (定動圧 1500 psf 経路の station 3 = 燃焼器出口) + CEA2 で γ/M_3 を補完。
# 導出は case/46.sern_design/cea/tmx_operating_points.py (CEA 入出力は同 cea/)。
#
#   設計点 = M∞6 powered (spec.inflow / spec.external / gas)。逆設計はこれで固定 (作動点で形状は変えない)。
#   作動点 = m6_on (巡航, NPR 35.4, w 0.5) / m10_on (最大 M, NPR 56.4, w 0.3) / m4_off (燃料遮断, NPR 2.8, w 0.2)
#   低 NPR 点は「低速飛行」ではなく**燃料遮断 (power-off)**。M_3 = 2.91 で超音速なので sonic_throat 不要。
#
# 目的 = −(摩擦込み C_T の重み付き平均), L_ramp/H。制約 C_M,w (x_ref −20H) ≥ −2.5。剥離割合を台帳に記録。
name: problem_cflD_6
type: sern_2d
gas:                       # R3 (2026-09-13): 排気 = CEA 凍結組成の擬似種 EXH (thermalMethod 2), 外気 = 空気 AIR。設計点 (逆設計 kernel の CPG) = m6_on の凍結 γ(T3)/cp(T3)
  model: frozen_tp
  thermo_href_temp: 298.15
  gamma: 1.2470
  cp: 1718.5
spec:
  wall_thermal: {mode: isothermal, Tw: 1000.0}   # R4b(ii) 2026-09-13: 断熱だと M∞10 板下面が回復温度 4600 K (非物理) で残差プラトー 5e-5;
                                                 # 等温 1000 K で残差 3.5 桁低下 (run_0103)。Tw は暫定 (冷却構造の代表値) — plan §8-11
  H_m: 0.1
  inflow:                  # 設計点 = 燃焼器出口 (TM X-71972 station 3, M∞6 φ=1)
    mode: supersonic
    M_in: 1.6308
    p_in: 101027.0
    T_in: 2328.0
  external:                # 設計点 = 自由流 (q̄ 71850 N/m^2 → h 24.2 km)
    M_inf: 6.0
    p_inf: 2851.0
    T_inf: 220.8
  operating_points:
  - name: m6_on            # 巡航 (設計点と同一)。NPR 35.4
    weight: 0.5
    external: {M_inf: 6.0, p_inf: 2851.0, T_inf: 220.8}
    inflow: {M_in: 1.6308, p_in: 101027.0, T_in: 2328.0}
    gas: {gamma: 1.2470, cp: 1718.5, composition: {'N2': 0.63890, 'H2O': 0.32695, 'H2': 0.01251, 'Ar': 0.00767, 'OH': 0.00604, 'O2': 0.00398, 'NO': 0.00206, 'H': 0.00125, 'O': 0.00037, 'CO2': 0.00021, 'CO': 0.00005}}   # 凍結 γ/cp(T3), CEA tp 平衡組成 (MW 24.429)
  - name: m10_on           # 最大飛行 M (φ=1.5 rich)。NPR 56.4 = 不足膨張側
    weight: 0.3
    warm_from: m6_on       # NPR 35.4 → 56.4 で近いので m6_on の収束場から立ち上げる (熱力学整合リマップ + 適応段)。
                           # m4_off (NPR 2.8, 空気 γ1.40) は遠すぎるので cold start のまま — plan §5.1-1c
    external: {M_inf: 10.0, p_inf: 1026.0, T_inf: 227.5}
    inflow: {M_in: 2.7171, p_in: 57935.0, T_in: 2222.0}
    gas: {gamma: 1.2549, cp: 1925.0, composition: {'N2': 0.54922, 'H2O': 0.29370, 'H2': 0.14592, 'Ar': 0.00659, 'H': 0.00320, 'OH': 0.00104, 'CO': 0.00016, 'NO': 0.00008, 'CO2': 0.00006, 'O': 0.00001, 'O2': 0.00001}}   # 凍結 γ/cp(T3), CEA tp 平衡組成 (MW 21.265)
  - name: m4_off           # 燃料遮断 (φ=0, 空気)。NPR 2.8 = 強い過膨張 → 剥離評価の対象
    weight: 0.2
    external: {M_inf: 4.0, p_inf: 6415.0, T_inf: 216.7}
    inflow: {M_in: 2.9101, p_in: 17888.0, T_in: 338.0}
    gas: {gamma: 1.3986, cp: 1007.2, composition: {'N2': 0.78084, 'O2': 0.20948, 'Ar': 0.00936, 'CO2': 0.00032}}   # 凍結 γ/cp(T3), CEA tp 平衡組成 (MW 28.965)
  moment_ref:
  - -20.0
  - 0.0
dv:
  # M_c 範囲は設計点の変更で張り直した (2026-09-05): NPR 35.4 / γ 1.183 では完全膨張 M_e = 3.59 で、
  # kernel 内に key point が在るのは M_c ≲ 3.4 まで。M_c 3.2 で既に L_ramp 16-20 H (旧 3.2-4.4 は不成立)。
  M_c:
    min: 2.4
    max: 3.4
    value: 2.9432012203823206
  f:
    min: 0.35
    max: 0.6
    value: 0.45416096145797885
  theta_r0_deg:            # NASA 基準形のランプ 20° を範囲に含む
    min: 10.0
    max: 22.0
    value: 15.0
  theta_c0_deg:            # NASA 基準形のカウル 6° を範囲に含む
    min: 2.0
    max: 8.0
    value: 5.0
  L_cowl:                  # 上限 4.5 H (2026-09-05 拡大)。旧 2.5 は **NASA 基準形 3.12 H を箱の外に置いており**、
                           # C_T が上限で飽和せず最適化が張り付いていた (plan §8-8)。S4 の CFD は Lc 2.0/3.12/4.5 で
                           # C_T 0.9605/0.9704/0.9720 と 4.5 でほぼ飽和。MOC スイープの C_M も Lc を伸ばすほど緩む
                           # (中央値 −7.25 @0.6 → −2.02 @4.5) ので cm_min −7.0 は据え置き
    min: 0.6
    max: 4.5
    value: 1.2
geometry:
  x_max_kernel: 20.0       # L_cowl 上限 4.5 に合わせて広げる (打ち切りは key point で効く)
  nj_moc: 301
  dx_moc: 0.002
  nj_moc_probe: 151
  dx_moc_probe: 0.004
  L_ramp_max: 20.0         # NASA 基準形 18.5 H と同スケール
mesh:
  discretization: node
  cowl_thickness: 0.005    # カウル TE のせん断層で ω→inf を防ぐ数値措置。0 は m4_off でも落ち (run_0035)、2e-3 は m10_on で落ちる
                           # (run_0042)。5e-3 で 3 作動点とも通る (run_0043)。1e-2 と力係数は 0.3 % 以内で同じ = 物理は動かない
  ni_up: 16
  ni_noz: 160              # L_ramp ~10 H に対する解像度補償 (旧 100 は L_ramp ~4 H 前提)
  ni_plume: 180
  nj_top: 81
  nj_bot: 51
  L_up: 0.5
  x_out_extra: 2.0
  bot_depth: 3.0
  first_wall_frac: 0.004
  ext_top: 1               # ランプ側外部流 (機体上面・base・後流 + 自由流バンド, plan §4.11)。無いと過膨張でも剥離が起きない
  top_depth: 2.0
  nj_ext_top: 41
  nj_wake: 9
  vehicle_clearance: 0.06        # 物理値 (旧実装は 0.02 と書いて max(0.02, 3*first_top_frac) = 0.06 に膨らませていた)
  first_top_frac: 0.02
  vehicle_taper: 0.35     # 機体後端テーパ長 = L_ramp の 35 %。係数は smoothstep (C¹) — 線形 clip はテーパ開始点で
                          # 上面が水平から不連続に折れ、M∞10 のスリップ壁上の凸角として ω 発散した (run_0071 inf_00/01)
  ramp_fillet: 0.1        # ランプ膨張角部 (x=0) の丸め半径 /H。鋭角だと SST が θ_r0 ≳ 18° で roOmega 発散 (run_0055-0057)。
                          # 曲率ジャンプ 1010 → 12.5、壁の持ち上げは最大 0.0019 H。NASA TM X-71972 も小半径で接続している
evaluate:
  model: sst
  nStepOuter: 12000        # frozen_tp は 12000 (2026-09-13 run_0095/0097: m10_on は本段 6000 では残差が step ~2300 の最小から 3–4 倍にリバウンド中で
                           #  RESIDUAL_RISING、12000 まで回すと 5–7e-5 で飽和して PASS。力係数は 6000 時点で既に 5 桁一致)
  p_min: 20.0              # EOS 圧力床 [Pa]。既定 1.0 Pa は m10_on の p∞ (1026 Pa) の 1/1000 で低すぎ、
                           # 機体上面 boat-tail の膨張で床を割ったノードが負密度に転落 → 圧力暴走 → ω 発散した
                           # (run_0075 で順序を確定)。20 Pa と 100 Pa で解は完全に同一 (C_T 0.9187, C_M −0.266,
                           # run_0077) なので、床は過渡の一瞬を守るだけで収束解には触れていない。所要も 150→32 s
  cfl_main: 6.0            # 本段 CFL。1.0 は限界的で、同一メッシュ・同一 config でも run により m10_on が step 171 で発散した
                           # (run_0048 成功 / run_0049 失敗)。0.5 で m10_on 2 回とも同一値、答えは 1.0 と一致 (run_0050-0053)
  outStepInterval: 500
opt:
  soft_steps: 4000
  soft_cfl: 0.1            # **frozen_tp は 0.1 × 4000** (soft / warm 適応段 / mid 段に共通)。CPG 生産値 0.2 では m10_on (m6_on から warm) の
                           #  mid 段がランプ後縁の EXH∩AIR 接触で NaN (run_0098 step 1386; run_0095 では同レシピが通った = 限界状態)。緩レシピ 0.1 は 3 回とも完走
  warm_lam_steps: 4000     # soft 段の前に層流暖機 (turbulence none)。カウル後縁のせん断層で SST が発散するのを防ぐ
  warm_lam_cfl: 0.1        # **frozen_tp は 0.1** (2026-09-13 run_0094: CPG 生産値 0.2 ではランプ後縁ノード (排気 EXH ∩ 機体側 AIR の接触) で
                           #  暖機 step 568 に T が床 50 K → ro NaN。緩レシピ 0.1 は完走。多成分 implicit の roe/roY 緩和ミスマッチ [[wys-tp-divergence-is-cold-not-multispecies]])
  mid_steps: 4000          # soft と本段の間に 2 次 + soft CFL の段 (次数と CFL を同時に上げない)。frozen_tp は 4000 (cfl 0.1 に合わせて倍)
  warm_adapt_steps: 500    # warm start 後の適応段 (1 次, soft CFL)。BC の違いを馴染ませる
  cm_min: -7.0             # 重み付き C_M (x_ref −20H) の下限。設計点 MOC C_M の dv 箱分布 (sweep_moc_dv_cycle3op.log: p10 −10.7 / med −6.9 /
                           # p90 −2.5) と重み付き比 ≈0.7 (m10_on/m4_off で緩む) から、最悪 ~15 % を落とす値。旧 −2.5 は L 3.8H 前提で候補が全滅する
