# ⑤ SERN RANS スモーク: problem_smoke_euler と同じ設計を node + SST (壁関数 wallTreatmentSST 1, y+~20-40) で評価する。
# 目的: 評価器の RANS 化の疎通と、非粘性 (MOC/Euler) との力係数差 (摩擦 + δ*) の把握 (S5 の入力)。
name: sern_smoke_sst_node_thick
type: sern_2d
gas: {gamma: 1.4, cp: 1004.5}
spec:
  H_m: 0.1
  inflow: {mode: supersonic, M_in: 2.5, p_in: 20000.0, T_in: 900.0}
  external: {M_inf: 6.0, p_inf: 1000.0, T_inf: 220.0}
  moment_ref: [0.0, 0.0]
dv:
  M_c: 3.9
  f: 0.45
  theta_r0_deg: 15.0
  theta_c0_deg: 5.0
  L_cowl: 1.0
geometry: {x_max_kernel: 9.0, nj_moc: 301, dx_moc: 2.0e-3}
mesh: {discretization: node, cowl_thickness: 2.0e-3, ni_up: 16, ni_noz: 120, ni_plume: 220, nj_top: 101, nj_bot: 61, L_up: 0.5, x_out_extra: 2.0, bot_depth: 3.0, first_wall_frac: 4.0e-3}
evaluate: {model: sst, nStepOuter: 8000, cfl_main: 1.0, outStepInterval: 500}
