# NS v4 物理壁 (--dstar-csv run_0021/dstar_v4.csv, blend -1,-0.5) + H2O 凝縮。IC = run_0022 (dry NS v4)。
# 加熱空気 M4.19 — 推奨点 R2/L_U6/L_c8 の NS 本計算 (node 壁解像 y+~1, 低 Re SST, wallTreatmentSST 0)。
# 壁 = inviscid + δ* (v1 = 相関 / v2 = CFD 抽出 --dstar-csv)。IC = coarse 中継の cross-mesh (ω 底層フロア付き)。
# 手順: plans/accepted/tooling-nozzle-axismach-viscous-deltastar.md, methods/design/overview.md「粘性 δ* 補正」「物理スロート (A13)」
name: vitair_wt_m419_R2_LU6_Lc8_ns_split_cond
type: wind_tunnel_axisym_axismach
gas:
  model: semiperfect
  transport: {N2: cea, O2: cea, AR: cea, CO2: cea, H2O: custom:h2o_iapws_cea_v1}   # 2026-09-27: 種ごとの輸送物性 (viscMethod 2 既定; plan thermophysics-solver-owned-species-db §4.3c)。H2O は IAPWS/CEA つなぎ
  species:
    H2O: 0.0286647
    N2: 0.6732631
    O2: 0.2301686
    AR: 0.0114568
    CO2: 0.0564467
  gamma: 1.32752
  cp: 1190.2
spec:
  Pt: 1140000.0
  Tt: 1060.0
  p_ambient: 5235.0
  r_throat: 0.210505
  M_design: 4.19
dv:
  L_c:
    value: 8.0
    min: 6.5
    max: 11.0
geometry:
  R: 2.0
  r_inlet: 3.8
  L_U: 6.0
  L_pipe: 0.5
  start_line: throat_char
  n_start: 41
  n_axis_inv: 500
  x_end_margin: 2.3
  wall_mode: cplus
  exit_mode: characteristic
  Lc_mode: explicit
mesh:
  discretization: node
  ni: 601
  nj: 97
  wall_first_frac: 3.5e-5   # y+ ≈ 0.8–6 (相関見積; スロート側が高い)。AR は check_mesh_quality で確認
  throat_refine: 3.0
evaluate:
  nStepOuter: 48000
  outStepInterval: 8000
  cfl_main: 1.0             # A12 レシピ (y+1.5 本段は cfl1)
  tp_species: split_h2o
  condensation: {condensation: 1, nCondSpecies: 1, condModel: 1, condKantrowitz: 1, condGrowthModel: 0}   # Kw+HK (Euler 版と同じ)。NS×凝縮は本 case が初適用
