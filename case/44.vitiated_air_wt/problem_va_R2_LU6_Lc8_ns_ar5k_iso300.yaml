# 等温壁チェーン (plan tooling-nozzle-isothermal-wall-chain §4.5): run_0107 (断熱 V4 pass 0) と同じ設計・同じ物理壁を、
# 冷却壁 (Tw 300 K, y+ ×5–6) に耐える壁法線細分メッシュ (AR 緩和 ≤5000: max 4140, 290k 節点, スロート y1+_cold ≈ 1) で回す。等温壁 300 K (S4a-B: 同一壁 / S4b: 等温再設計)。
# 加熱空気 M4.19 — 推奨点 R2/L_U6/L_c8 の NS 本計算 (node 壁解像 y+~1, 低 Re SST, wallTreatmentSST 0)。
# 壁 = inviscid + δ* (v1 = 相関 / v2 = CFD 抽出 --dstar-csv)。IC = coarse 中継の cross-mesh (ω 底層フロア付き)。
# 手順: plans/accepted/tooling-nozzle-axismach-viscous-deltastar.md, methods/design/overview.md「粘性 δ* 補正」「物理スロート (A13)」
name: vitair_wt_m419_R2_LU6_Lc8_ns_ar5k_iso300
type: wind_tunnel_axisym_axismach
gas:
  model: semiperfect
  species:
    H2O: 0.0286647
    N2: 0.6732631
    O2: 0.2301686
    AR: 0.0114568
    CO2: 0.0564467
  gamma: 1.32752
  cp: 1190.2
spec:
  Pt: 1140000.0
  Tt: 1060.0
  p_ambient: 5235.0
  r_throat: 0.210505
  M_design: 4.19
  wall_thermal: {mode: isothermal, Tw: 300.0}
dv:
  L_c:
    value: 8.0
    min: 6.5
    max: 11.0
geometry:
  R: 2.0
  r_inlet: 3.8
  L_U: 6.0
  L_pipe: 0.5
  start_line: throat_char
  n_start: 41
  n_axis_inv: 500
  x_end_margin: 2.3
  wall_mode: cplus
  exit_mode: characteristic
  Lc_mode: explicit
mesh:
  discretization: node
  ni: 2401
  nj: 121
  wall_first_frac: 8.0e-6        # 冷却壁 (Tw 300 K) で下流 y1+ ≈ 1.0–1.7
  wall_first_frac_throat: 8.0e-7 # スロート近傍 y1+_cold ≈ 1.0 (第一セル 0.2 µm)
  wall_first_blend_x0: 1.5
  wall_first_blend_x1: 10.0
  wall_first_up_x0: -4.0
  wall_first_up_x1: -1.5
  throat_refine: 30.0
  throat_width: 3.0
  ar_max: 5000                   # AR 緩和 (2026-09-12 ユーザ決定): 壁法線構造層は ≤5000 (mesh_probe_iso.py: max 4140)
evaluate:
  nStepOuter: 24000
  outStepInterval: 4000
  cfl_main: 2.0
  implicit_relax: 0.7             # A12 レシピ (y+1.5 本段は cfl1)
