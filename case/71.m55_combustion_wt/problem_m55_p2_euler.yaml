name: m55_combustion_wt   # 要求カードの name
type: wind_tunnel_axisym_axismach

gas:   # カードの gas (model は semiperfect 固定)
  model: semiperfect   # 生成器 (カードの gas は常に semiperfect)
  transport: {CO2: cea, H2O: 'custom:h2o_iapws_cea_v1', O2: cea, N2: cea}   # 雛形 axismach_final_v1: 実種ごとに cea (H2O は custom:h2o_iapws_cea_v1)
  species: {CO2: 0.1677, H2O: 0.0858, O2: 0.022, N2: 0.7245}   # 質量分率 (カードの gas: {species: {CO2: 0.1677, H2O: 0.0858, O2: 0.022, N2: 0.7245}})
  gamma: 1.29078   # 参照値: スロート T* の γ (semiperfect では NASA-9 が優先)
  cp: 1296.35   # 参照値: c_p(T*) [J/(kg K)]

deltastar_initializer:
  model: contur   # overrides で上書き (雛形/生成値: (無し))
  delta_scale: 0.852087987522164   # overrides で上書き (雛形/生成値: (無し))
  delta_offset_m: -0.0003220418618084591   # overrides で上書き (雛形/生成値: (無し))

spec:
  Pt: 3500000.0   # カード conditions.Pt [Pa]
  Tt: 1250.0   # カード conditions.Tt [K]
