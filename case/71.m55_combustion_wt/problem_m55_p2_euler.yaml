  M_design: 5.5   # カード M_exit
  wall_thermal: {mode: isothermal, Tw: 350.0}   # カード wall
  sizing: {method: throat, target_m: 0.1}   # カード throat.diameter_physical_m 0.2 m の半径 (物理スロート) で寸法を決めた

dv:   # Lc_mode: from_length の設計変数 (r_t 単位)
