mesh: {discretization: "node", isAxisymmetric: 1, axisCentroidShift: 1, nodeWallDirichlet: 1, meshFileName: "nozzle.h5", valueFileName: "nozzle.h5"}
gpu: 1
solver: "SLAU"
physProp: {thermalMethod: 2, viscMethod: 2,
           visc: 1.8e-5, thermCond: 0.0257, prandtlLam: 0.72, cp: 1296.35, gamma: 1.29078,
           species: [{name: "MIXDRY", lump: {"CO2": 0.12550903682310086, "O2": 0.022645262404230745, "N2": 0.8518457007726683}, basis: mole}, "H2O"],
           transport: {"CO2": "cea", "O2": "cea", "N2": "cea", "H2O": "custom:h2o_iapws_cea_v1"}, thermoHrefTemp: 298.15}
time:
  unsteady: 0
  dualTime: 0
  last: {nStepOuter: 200000}
  deltaT: {control: 1, dt: 1e-8, cfl: 1.0, cfl_pseudo: 1.0,
           dt_min: 1e-9, dt_max: 0.001, blockDPLUR: 1, lowMachPrecond: 0, detectNaN: 1}
  outStepStart: 0
  outStepInterval: 1000
  timeIntegration: 11
  nStepInner: 5
space: {convMethod: 1, limiter: 2}
turbulence: {model: "sst", scalarDiffusion: 1, dilatationCorrection: 2, katoLaunder: 1, wallTreatmentSST: 0, turbulentPrandtl: 0.9}
initial: "uniform_p101325_u10"
