mesh:
  discretization: "node"
  meshFileName: "hill_des_160x100x60.h5"
  valueFileName: "hill_des_160x100x60.h5" # run_0002 RANS 収束場 + 撹乱にパッチ済み

gpu: 1
detectNaN: 1
detectNaNInterval: 100

solver: "SLAU" # 切り分け: KEEP+dual-time が step7 NaN のため実績構成 (backstep DDES) に変更
lowMachPrecond: 2

bodyForce: [1000.0, 0.0, 0.0]  # 初期値 (bodyForceCtrl が毎ステップ更新)
bodyForceCtrl: 1
bodyForceCtrlTarget: 44.1248  # <ρu_x>_V = ρ0·Ub·A_crest·Lx/V (Ub=52)
bodyForceCtrlRelax: 0.02

physProp:
  isAxisymmetric: 0
  thermalMethod: 0    # CPG
  viscMethod: 0       # 定数粘性
  visc : 1.617e-4     # nu=1.374e-4 → Re=Ub*h/nu=10595
  thermCond: 0.2256   # Pr=0.72
  cp : 1004.5
  gamma : 1.4

time:
  unsteady: 1
  dualTime: 1         # 音響 CFL (y1=2.8e-5m, dt_ac~7e-8) を回避し物理精度 dt で回す
  nSubIterDualTime: 20
  last:
    nStepOuter: 2000  # スモーク (~1.6 FT)
    time: 1.00
  deltaT:
    control: 0        # dual-time は物理 dt 固定必須
    dt: 0.000001      # dt* = dt·Ub/h = 0.0074 (ESAIM の 0.02-0.036 より細かい)
    cfl: 1.0
    cfl_pseudo: 1.0
    blockDPLUR: 1
    implicitRelax: 0.5
    dt_min: 0.000000001
    dt_max: 1.0
  outStepStart: 0
  outStepInterval: 500
  timeIntegration: 11 # block DPLUR dual-time
  nStepInner: 5

space:
  convMethod: 2
  limiter: -1   # KEEP スタックでは流束に不関与
  pRef: 101325.0

turbulence:
  model: "sst-ddes"
  wallTreatmentSST: 1
  nodeOmegaWfDirichlet: 1
  kInf: 1.0
  omegaInf: 5000.0

initial: "uniform_p101325_u10" # 未使用 (IC は valueFileName)
