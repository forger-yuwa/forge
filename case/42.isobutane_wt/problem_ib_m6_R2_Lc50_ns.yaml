# M6 推奨点 R2/L_U12/L_c50 の NS 直接検証 (2026-08-30, M5 と同フロー):
# 物理壁 (A13) + no-slip 断熱壁 + SST。coarse (y+~50 中継) → 本計算 (y+~1)。
# M6 スタディ点 R2_Lc50_MK2.5 (基底 problem_ib_m6.yaml、差分: R=2, L_c=50, M_knot=2.5, L_U=12)
name: isobutane_wt_m6_R2_Lc50_ns
type: wind_tunnel_axisym_axismach
gas:
  model: semiperfect
  transport: {CO2: cea, H2O: custom:h2o_iapws_cea_v1, O2: cea, N2: cea}   # 2026-09-27: 種ごとの輸送物性 (viscMethod 2 既定; plan thermophysics-solver-owned-species-db §4.3c)。H2O は IAPWS/CEA つなぎ
  species:
    CO2: 0.1677
    H2O: 0.0858
    O2: 0.022
    N2: 0.7245
  gamma: 1.2755
  cp: 1394.0
spec:
  Pt: 5.0e6
  Tt: 1550.0
  p_ambient: 2070.0
  r_throat: 0.05375
  M_design: 6.0
dv:
  L_c:
    value: 50.0
    min: 20.0
    max: 80.0
geometry:
  R: 2.0
  r_inlet: 9.303
  L_U: 12.0
  L_pipe: 0.5
  start_line: throat_char
  n_start: 41
  n_axis_inv: 1200
  axis_dx0: 0.03
  x_end_margin: 2.3
  wall_mode: cplus
  exit_mode: characteristic
  axis_law: knot
  M_knot: 2.5
  Lc_mode: explicit
mesh:
  discretization: node
  ni: 1250   # ni1100/wf4.5e-5 は AR1538 FAIL、ni1700/wf4.5e-5 は双対閉性破綻 (第一セル2.4µm) → ni1250/wf6.5e-5
  nj: 97
  wall_first_frac: 6.5e-5   # y+~1.4 (第一セル~3.5µm = M5 相当; 4.5e-5 は双対CV閉性が破綻)
  throat_refine: 3.0
evaluate:
  nStepOuter: 24000
  outStepInterval: 8000
  cfl_main: 1.0
  mid_stage: true
