% SU2 との照合 (plan tooling-nozzle-isothermal-wall-chain §5.1 #26): case/45 の冷却壁用の格子 (57 万節点、run_0181 の nozzle.msh を 17 桁のまま変換)、
% 壁は生産の TP の対と同じ、気体は CPG (γ 1.27354、R 292.1105、Sutherland 1.716e-5/273/111、Pr 0.72、Pr_t 0.9) で forge の CPG の run と同じ。
% forge の比較相手: 素の SST (dilatationCorrection 0・katoLaunder 0) の run_0184 (断熱) / run_0185 (300 K)。
SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m
MATH_PROBLEM= DIRECT
SYSTEM_MEASUREMENTS= SI
AXISYMMETRIC= YES
RESTART_SOL= NO

FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.27354
GAS_CONSTANT= 292.1104951552365

VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716e-5
MU_T_REF= 273.0
SUTHERLAND_CONSTANT= 111.0
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
PRANDTL_TURB= 0.9

REF_DIMENSIONALIZATION= DIMENSIONAL
INIT_OPTION= TD_CONDITIONS
FREESTREAM_PRESSURE= 3.0e6
FREESTREAM_TEMPERATURE= 1500.0
MACH_NUMBER= 0.15
FREESTREAM_TURBULENCEINTENSITY= 0.0073
FREESTREAM_TURB2LAMVISCRATIO= 7.2

INLET_TYPE= TOTAL_CONDITIONS
MARKER_INLET= ( inlet, 1600.0, 5500000.0, 1.0, 0.0, 0.0 )
% forge の入口 k = 1、ω = 18000 に相当 (入口 U ≈ 10.6 m/s、ρ ≈ 11.9、μ(1600 K) ≈ 5.47e-5)
MARKER_INLET_TURBULENT= ( inlet, 0.077, 12.1 )
MARKER_OUTLET= ( outlet, 2237.0 )
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( axis )
MARKER_MONITORING= ( wall )

NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT

CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 2.0, 50.0 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-4
LINEAR_SOLVER_ITER= 10

ITER= 80000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -14
CONV_STARTITER= 500

MARKER_ANALYZE= ( outlet )
MARKER_ANALYZE_AVERAGE= MASSFLUX

MESH_FORMAT= SU2
MESH_FILENAME= nozzle.su2
TABULAR_FORMAT= CSV
OUTPUT_FILES= ( RESTART, RESTART_ASCII, SURFACE_CSV )
OUTPUT_WRT_FREQ= 10000, 10000, 10000
WRT_RESTART_OVERWRITE= NO
WRT_SURFACE_OVERWRITE= NO
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
SURFACE_FILENAME= surface_flow
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_MOMENTUM-Y, RMS_ENERGY, RMS_TKE, RMS_DISSIPATION, CFL_NUMBER, AVG_MASSFLOW, TOTAL_HEATFLUX )
SCREEN_WRT_FREQ_INNER= 500
HISTORY_OUTPUT= ( ITER, RMS_RES, FLOW_COEFF, HEAT, CFL_NUMBER )
READ_BINARY_RESTART= YES
SOLUTION_FILENAME= restart_flow
