  r_inlet: 6.485        # 入口配管の物理半径 0.5 m / r_t (収縮比 A_in/A* = 42.1)
  L_U: 12.0             # μ = L_U²/(RΔr) = 13.1 ≤ 20 (単調収縮 OK)
  L_pipe: 0.5
  start_line: throat_char
  n_start: 41
  n_axis_inv: 2400
  axis_dx0: 0.03
  x_end_margin: 2.3
  wall_mode: cplus
  # CFD ピン (plan tooling-nozzle-cfd-pinned-initial-line, ユーザ採用 2026-10-05): 初期線・m*・軸アンカーを凍結源 (Hall 初期線の V0 型壁の Euler, main 統合ビルド) から
  initial_line: cfd
  initial_line_run: run_0062_euler_wallfit_fit_r1_ext6k
  initial_line_res: res_6000.h5
  wall_repr: joint             # 位置+壁角の同時当てはめ (V0 型始点)、物理壁は解析経路
  wall_fit_mono_r2: [0.0, 1.5]   # r″ を [0, 1.5] r_t で単調非増加に拘束 (plan tooling-nozzle-throat-monotone-r2 §4.1)
  pw_upstream: poly           # 配管〜設計スロートの 5 次多項式、上流に δ_r を足さない (plan tooling-nozzle-upstream-poly-and-throat-sizing §4.1。pw_ramp は併記不可なので外した)
  physical_wall_repr: single_bspline   # 全域 1 本の 5 次 B-spline (ソルバ入力は区分表現とビット同一; plan tooling-nozzle-wall-single-bspline)
  Md_moc_offset: 6.8825162455159465e-06       # 出口較正 (Euler の E4 の結果; make_ns_n012_problems.py --md-offset で書き込み。元の YAML の値 0.000377 は G1 の Euler の較正)
  moc_axis_limit: analytic     # 軸上の端点の sinθ/r を解析極限 θ_r に (plan discretization-moc-axis-limit-and-corrector §4.1)
  moc_corrector: converge      # 予測修正を収束まで (同 plan §4.2)
  exit_mode: characteristic
  axis_law: knot
  M_knot: 2.7
  Lc_mode: explicit

