#   生成: make_prod_problems.py (手で編集しない)。元: problem_d155_ns_n012_N2_cond.yaml (sha256 e1c53f5ee288ce54…)。元との差は name とこの冒頭と physical_wall_repr の行だけ。
#   生産の NS は N2 の run_0167 + 延長 run_0179、凝縮は run_0170 (plans/accepted/tooling-nozzle-upstream-poly-and-throat-sizing.md §9)。
# ---- 以下は元の YAML ----
# plans/active/tooling-nozzle-upstream-poly-and-throat-sizing.md §6 U4 (NS の 3 条件)・plans/active/discretization-moc-axis-limit-and-corrector.md §6 V5d (順序)・V5′: 条件 N2 (凝縮 ON)。
