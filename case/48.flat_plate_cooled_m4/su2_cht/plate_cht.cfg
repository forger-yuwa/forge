% case/48 冷却平板の multizone CHT (CHT V2 の case/48 段)
SOLVER= MULTIPHYSICS
MATH_PROBLEM= DIRECT
CONFIG_LIST= ( fluid.cfg, solid.cfg )
MULTIZONE_MESH= NO
MARKER_ZONE_INTERFACE= ( wall, solid_interface )
MARKER_CHT_INTERFACE= ( wall, solid_interface )
TIME_DOMAIN= NO
OUTER_ITER= 200
% 静止スラブで踏んだ罠の回避: 判定は固体側に付ける (procedures/su2-cross-check.md)
CONV_FIELD= AVG_BGS_RES[1]
CONV_RESIDUAL_MINVAL= -14
CONV_STARTITER= 100
HISTORY_OUTPUT= ( ITER, BGS_RES[0], BGS_RES[1], HEAT[0], HEAT[1] )
OUTPUT_FILES= ( RESTART_ASCII )
SCREEN_OUTPUT= ( OUTER_ITER, AVG_BGS_RES[0], AVG_BGS_RES[1] )
OUTPUT_WRT_FREQ= 1000
