# pintle nozzle 試計算 第1段 (起動・易):
#   Euler (visc=0, thermCond=0) + slip 壁 + 1次風上 + 陰解法 blockDPLUR + pRef
#   IC: チャンバー滞留一様場 (p=3e6 Pa, T=2889K, u=0; forge.h5 /VALUE に直書き)
#   気体: 論文物性 gamma=1.274, R=370 J/kgK (cp = gamma*R/(gamma-1) = 1720.4)
#   procedures/divergence-and-startup.md の段階起動 第1段に準拠
mesh:
  discretization: "node"
  bndFirstOrder: 1
  nodeWallViscGradFlux: 1
  nodeWallDirichlet: 1
  meshFileName: "forge.h5"
  valueFileName: "forge.h5"

gpu: 1
solver: "SLAU"

physProp:
  isAxisymmetric: 0
  thermalMethod: 0
  viscMethod: 0
  visc: 9.0e-5      # [Pa s] 高温燃焼ガス定数粘性 (第2段: 層流 no-slip)
  thermCond: 0.215   # cp*visc/Pr (Pr=0.72)
  cp: 1720.4
  gamma: 1.274

time:
  unsteady: 0
  dualTime: 0
  last:
    nStepOuter: 20000
  deltaT:
    control: 1
    dt: 1.0e-8
    cfl: 0.5
    cfl_pseudo: 0.5
    dt_min: 1.0e-10
    dt_max: 1.0e-3
    blockDPLUR: 1
    implicitRelax: 1.0
    lowMachPrecond: 0
    detectNaN: 1     # 試計算なので発散をその場で捕捉
  outStepStart: 0
  outStepInterval: 500
  timeIntegration: 11
  nStepInner: 5

space:
  convMethod: 0      # 1次風上 (第1段)
  limiter: 2
  pRef: 3.0e6        # 動作静圧 (チャンバー圧)。非直交 float32 の free-stream 桁落ち対策

turbulence:
  model: "sst"
  wallTreatmentSST: 1
  kInf: 4.0
  omegaInf: 500.0

initial: "uniform_p101325_u10"   # ダミー (valueFileName の /VALUE から読むため未使用)
