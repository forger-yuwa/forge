mesh:
  meshFileName: "bump_4pct.h5"
  valueFileName: "bump_4pct.h5"
  #meshFormat: "hdf5" 
  #meshFileName: "mach3.h5"


gpu: 1 # 0:off , 1:on

solver: "SLAU" # 
#solver: "KEEP_SLAU" # 

physProp:
  thermalMethod: 0 # 0:calorically perfect
  viscMethod: 0 # 0:use visc , 1:sutherland
  visc : 0.0   #[Pa*s]
  thermCond: 0.0    # [W/(mK)]
  cp : 1005.0 # [J/(kgK)]
  gamma : 1.4 # [J/(kgK)]

time: 
  unsteady: 0 # 0:steady , 1:unsteady
  dualTime: 0 # 1:use pseudo time for unsteady
  last: 
    #nStep: 8000
    nStepOuter: 2000
    #nStep: 10  
    time: 1.00 # [second]
  deltaT:  
    control: 1 # 0:use dt , 1:use cfl
    dt: 0.00000001
    cfl: 1.5
    cfl_pseudo: 1.0
    dt_min: 0.000000001
    dt_max: 1.0 
  #outStepInterval: 1000
  #outStepInterval: 1
  outStepInterval: 20
  outStepStart: 0
  timeIntegration: 3  # 1:Euler explicit , 3:3rd Runge Explicit , 10:dual-exp
  nStepInner: 10

space: 
  convMethod: 2
  limiter: 2

turbulence:
  model: "none"

initial: "bump_M1.65"
